# Generalization — train on obstacle=4, zero-shot test on 0/2/4/6/8
experiment:
  id: gen_train_obs4
  stage: 6
  name: "Generalization Train (obs=4)"

train:
  seed: 42
  total_frames: 102_400
  lock_total_frames: true
  lock_eval_episodes: true
  eval_episodes: 200

env:
  scenario: navigation_obstacle
  num_agents: 4
  num_envs: 16
  num_obstacles: 4
  comm_radius: 0.5
  world_spawning_x: 1.5
  world_spawning_y: 1.5

output:
  category: generalization
  results_dir: results

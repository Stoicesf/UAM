experiment:
  id: comm_mappo_r1
  stage: 0
  name: MAPPO @ R=1 (16 UAV)
train:
  seed: 42
  algorithm: mappo
  total_frames: 102400
  frames_per_batch: 2048
  num_epochs: 5
  minibatch_size: 512
  learning_rate: 0.0003
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  critic_coef: 1.0
  hidden_dim: 128
  share_params_policy: true
  share_params_critic: true
  use_guidance: false
  use_guidance_reward: false
  log_dir: logs
  checkpoint_dir: checkpoints
  save_interval: 10000
  log_interval: 1
  eval_episodes: 200
  lock_total_frames: true
  lock_eval_episodes: true
env:
  scenario: navigation
  num_envs: 8
  num_agents: 16
  device: cuda
  continuous_actions: true
  max_steps: 128
  comm_radius: 1.0
  obs_dim: 18
  action_dim: 2
  guidance_dim: 4
guidance:
  mode: none
  use_guidance_reward: false
output:
  category: communication
  results_dir: results
comm_sweep:
  method: mappo
  radius_key: '1'
  radius_label: '1'
  comm_radius: 1.0

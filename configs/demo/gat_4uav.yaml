# Paper Demo — GAT-A @ 4 UAV (load frozen gat_a_lambda003)
experiment:
  id: demo_gat_4uav
  stage: 2
  name: "Demo GAT 4 UAV"

train:
  seed: 42
  total_frames: 2048
  frames_per_batch: 2048
  algorithm: guided_mappo
  eval_episodes: 5

env:
  scenario: navigation
  num_agents: 4
  num_envs: 1
  device: cpu
  max_steps: 128
  comm_radius: 0.5

guidance:
  mode: gat
  guidance_dim: 4
  hidden_dim: 128
  comm_radius: 0.5
  num_gat_layers: 1
  use_guidance_reward: true
  guidance_reward_coef: 0.03
  guidance_warmup: true
  guidance_warmup_fraction: 0.3
  guidance_schedule: adaptive_align
  guidance_coef_min: 0.005
  guidance_decay_k: 3.0

output:
  category: demo
  results_dir: demo

# Stage 3 / Exp4 — Dynamic Graph + Sparse Attention
experiment:
  id: exp3_graph
  stage: 3
  name: "MAPPO + Dynamic Graph Guide"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo

env:
  comm_radius: 0.5

guidance:
  mode: graph
  guidance_dim: 4
  hidden_dim: 128
  num_heads: 4
  comm_radius: 0.5
  use_guidance_reward: true
  guidance_reward_coef: 0.1

output:
  results_dir: results
  figures_dir: figures

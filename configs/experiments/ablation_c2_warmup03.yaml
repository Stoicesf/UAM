# C2 — lower λ=0.03 + longer 30% warmup (102k)
experiment:
  id: ablation_c2
  stage: 1
  name: "C2: lambda=0.03 warmup30% 102k"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo

guidance:
  mode: mlp
  guidance_dim: 4
  hidden_dim: 128
  use_guidance_reward: true
  guidance_reward_coef: 0.03
  guidance_warmup: true
  guidance_warmup_fraction: 0.3
  guidance_schedule: warmup_ramp

output:
  category: guide
  results_dir: results

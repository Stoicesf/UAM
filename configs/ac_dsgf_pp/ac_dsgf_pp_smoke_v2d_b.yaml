# AC-DSGF++ v2d Version B — more aggressive budget
# lambda_budget: 0.1, target_comm: 0.3
# Only run after Version A smoke if A under-compresses.
experiment:
  id: ac_dsgf_pp_smoke_v2d_b
  stage: 6
  name: "AC-DSGF++ Smoke v2d-B Aggressive Budget 4UAV 20k"

train:
  seed: 42
  total_frames: 20_480
  lock_total_frames: true
  lock_eval_episodes: true
  eval_episodes: 32
  algorithm: guided_mappo

env:
  scenario: navigation
  num_agents: 4
  num_envs: 16
  comm_radius: 0.5

guidance:
  mode: ac_dsgf_pp
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_temporal: true
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  beta_min: 0.0
  beta_warmup_fraction: 0.2
  beta_decay_k: 3.0
  utility_warmup_steps: 5000
  lambda_comm: 0.0
  lambda_budget: 0.1
  target_comm: 0.3
  lambda_u: 0.5
  lambda_rank: 0.1
  gate_residual: true
  gate_residual_alpha: 0.5
  gate_residual_alpha_after: 0.8

output:
  category: ac_dsgf_pp
  results_dir: results
  tag: AC_DSGF_PP_SMOKE_V2D_B

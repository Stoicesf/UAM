# Copy of smoke — ablation: gate without utility (v1 controller)
experiment:
  id: ac_dsgf_pp_ablation_wo_utility
  stage: 6
  name: "AC-DSGF++ ablation wo_utility"

train:
  seed: 42
  total_frames: 20_480
  lock_total_frames: true
  eval_episodes: 32
  algorithm: guided_mappo

env:
  scenario: navigation
  num_agents: 4
  num_envs: 16
  comm_radius: 0.5

guidance:
  mode: ac_dsgf_pp
  pp_ablation: wo_utility
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_temporal: true
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  lambda_comm: 0.0001
  lambda_u: 0.0

output:
  category: ac_dsgf_pp
  results_dir: results
  tag: AC_DSGF_PP_ABL_WO_UTILITY

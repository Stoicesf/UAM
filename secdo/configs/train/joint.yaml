mode: joint
seed: 0
amp: true
latent_dim: 32
load_predictor: checkpoints/secdo_platform/pretrain/best.pt

schedule:
  frozen_epochs: 1
  head_only_epochs: 2
  joint_epochs: 2
  steps_per_epoch: 4

optim:
  lr: 1.0e-3
  lr_joint: 3.0e-4
  eta: 0.25
  gamma_v: 1.0
  lambda_pred: 1.0

loss:
  lambda_s: 0.5
  lambda_c: 1.0
  lambda_u: 0.1

env:
  regime: fast
  horizon: 32
  n_agents: 8
  batch: 8

ckpt_dir: checkpoints/secdo_platform/joint
log_dir: runs/secdo_platform/joint

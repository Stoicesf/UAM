# AC-DSGF++ Phase 5-final — CAU-v2 U* supervision repair (last ++ smoke)
#
# ONLY change vs prior ++ smokes: utility_target = v2
#   - signed batch-norm sigmoid (no positive clamp → no label collapse)
#   - H=10 discounted ΔV credit
#   - weights: 0.6 ΔV + 0.35 ΔR + 0.05 ΔA
#
# Locked: hinge, λ_u=0.5, λ_b=0, λ_comm=0  (no budget / λ retune)
#
# Gates: Success≥18% | corr≥0.45 | U mean 0.1–0.4 | Comm 0.1–0.5
# FAIL → freeze AC-DSGF v1 for submission; ++ → supplement only
experiment:
  id: ac_dsgf_pp_cau_v2_smoke
  stage: 10
  name: "AC-DSGF++ CAU-v2 U* Repair 4UAV 20k"

train:
  seed: 42
  total_frames: 20_480
  lock_total_frames: true
  lock_eval_episodes: true
  eval_episodes: 32
  algorithm: guided_mappo

env:
  scenario: navigation
  num_agents: 4
  num_envs: 16
  comm_radius: 0.5

guidance:
  mode: ac_dsgf_pp
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_temporal: true
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  beta_min: 0.0
  beta_warmup_fraction: 0.2
  beta_decay_k: 3.0
  utility_warmup_steps: 5000
  lambda_comm: 0.0
  lambda_budget: 0.0
  target_comm: 1.0
  lambda_u: 0.5
  lambda_rank: 0.1
  ranking_mode: hinge
  # --- CAU-v2 ---
  # cau_alpha = ΔR weight, cau_beta = ΔV weight, cau_gamma = ΔA weight
  utility_target: v2
  cau_alpha: 0.35
  cau_beta: 0.6
  cau_gamma: 0.05
  cau_horizon: 10
  cau_td_gamma: 0.95
  use_utility_in_gate: true
  use_utility_in_policy: true
  gate_residual: true
  gate_residual_alpha: 0.5
  gate_residual_alpha_after: 0.8

output:
  category: ac_dsgf_pp
  results_dir: results
  tag: AC_DSGF_PP_CAU_V2_SMOKE

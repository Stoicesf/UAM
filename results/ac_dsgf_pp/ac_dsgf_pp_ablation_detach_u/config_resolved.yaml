experiment:
  id: ac_dsgf_pp_ablation_detach_utility
  stage: 6
  name: AC-DSGF++ Ablation Detach Utility Backbone 4UAV 20k
train:
  seed: 42
  algorithm: guided_mappo
  total_frames: 20480
  frames_per_batch: 2048
  num_epochs: 5
  minibatch_size: 512
  learning_rate: 0.0003
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  critic_coef: 1.0
  hidden_dim: 128
  share_params_policy: true
  share_params_critic: true
  use_guidance: false
  use_guidance_reward: false
  log_dir: logs
  checkpoint_dir: checkpoints
  save_interval: 10000
  log_interval: 1
  eval_episodes: 32
  lock_total_frames: true
  lock_eval_episodes: true
env:
  scenario: navigation
  num_envs: 16
  num_agents: 4
  device: cuda
  continuous_actions: true
  max_steps: 128
  comm_radius: 0.5
  obs_dim: 18
  action_dim: 2
  guidance_dim: 4
guidance:
  mode: ac_dsgf_pp
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_temporal: true
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  beta_min: 0.0
  beta_warmup_fraction: 0.2
  beta_decay_k: 3.0
  utility_warmup_steps: 5000
  lambda_comm: 0.0
  lambda_budget: 0.02
  target_comm: 1.0
  lambda_u: 0.5
  lambda_rank: 0.1
  ranking_mode: hinge
  use_utility_in_gate: true
  use_utility_in_policy: false
  gate_residual: true
  gate_residual_alpha: 0.5
  gate_residual_alpha_after: 0.8
output:
  category: ac_dsgf_pp
  results_dir: results
  tag: AC_DSGF_PP_ABLATION_DETACH_U

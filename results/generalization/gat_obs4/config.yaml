experiment:
  id: gen_gat_obs4
  stage: 2
  name: "GAT Generalization Train obs=4"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo
  lock_total_frames: true
  lock_eval_episodes: true
  eval_episodes: 200

env:
  scenario: navigation_obstacle
  num_agents: 4
  num_envs: 16
  num_obstacles: 4
  comm_radius: 0.5
  world_spawning_x: 1.5
  world_spawning_y: 1.5

guidance:
  mode: gat
  guidance_dim: 4
  hidden_dim: 128
  comm_radius: 0.5
  num_gat_layers: 1
  use_guidance_reward: true
  guidance_reward_coef: 0.03
  guidance_warmup: true
  guidance_warmup_fraction: 0.3
  guidance_schedule: adaptive_align
  guidance_coef_min: 0.005
  guidance_decay_k: 3.0

output:
  category: generalization
  results_dir: results

# Ablation: w/o Temporal — spatial-only, no GRU memory
experiment:
  id: ablation_wo_temporal
  stage: 4
  name: "DSGF v2 w/o Temporal"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo

env:
  comm_radius: 0.5

guidance:
  mode: dsfg
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_dynamic_quality: true
  use_temporal: false
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  beta_min: 0.0
  beta_warmup_fraction: 0.2
  beta_decay_k: 3.0

output:
  category: dsgf
  results_dir: results

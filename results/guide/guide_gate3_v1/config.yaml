# Stage 1 / Exp2 — Guide Field MLP (obs -> Phi, no Attention/Graph)
experiment:
  id: exp1_guide
  stage: 1
  name: "MAPPO + Guide MLP"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo

guidance:
  mode: mlp
  guidance_dim: 4
  hidden_dim: 128
  use_guidance_reward: true
  guidance_reward_coef: 0.1

output:
  category: guide
  results_dir: results
  figures_dir: figures
  tag: Guide_v1

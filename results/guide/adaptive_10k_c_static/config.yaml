# Ablation C — obs+Phi, lambda=0.05 + 20% warmup
experiment:
  id: ablation_c
  stage: 1
  name: "Ablation C: lambda=0.05 + warmup"

train:
  seed: 42
  total_frames: 10_240
  algorithm: guided_mappo

guidance:
  mode: mlp
  guidance_dim: 4
  hidden_dim: 128
  use_guidance_reward: true
  guidance_reward_coef: 0.05
  guidance_warmup: true
  guidance_warmup_fraction: 0.2

output:
  category: guide
  results_dir: results

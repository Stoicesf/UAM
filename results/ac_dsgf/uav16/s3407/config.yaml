# AC-DSGF Phase-1 Formal — 16 UAV · 102k · matches baseline16 protocol
# Reuses DSGF v2 residual stack; adds adaptive communication controller.
# Do NOT modify configs/dsgf/dsgf_v2_frozen.yaml.
experiment:
  id: ac_dsgf_16uav
  stage: 5
  name: "AC-DSGF 16 UAV Formal"

train:
  seed: 42
  total_frames: 102_400
  lock_total_frames: true
  lock_eval_episodes: true
  eval_episodes: 200
  algorithm: guided_mappo

env:
  scenario: navigation
  num_agents: 16
  num_envs: 8
  comm_radius: 0.5

guidance:
  mode: ac_dsgf
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_temporal: true
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  beta_min: 0.0
  beta_warmup_fraction: 0.2
  beta_decay_k: 3.0
  lambda_comm: 0.001

output:
  category: ac_dsgf
  results_dir: results
  tag: AC_DSGF_16UAV

# Online adaptation — L_c with ||Δθ|| ≤ ζ via clip_grad_norm_
stage: online_adapt
seed: 0
device: cuda:0
amp: false

load_predictor: checkpoints/secdo_joint/best.pt

online_adapt:
  enabled: true
  lr: 1.0e-3
  zeta: 0.05
  steps: 200
  project_params: true

optim:
  eta: 0.25

env:
  regime: fast
  horizon: 96
  n_agents: 8
  batch: 8

ckpt_dir: checkpoints/secdo_online

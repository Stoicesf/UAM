experiment:
  id: gen_mappo_obs4
  stage: 0
  name: "MAPPO Generalization Train obs=4"

train:
  seed: 42
  total_frames: 102_400
  algorithm: mappo
  lock_total_frames: true
  lock_eval_episodes: true
  eval_episodes: 200

env:
  scenario: navigation_obstacle
  num_agents: 4
  num_envs: 16
  num_obstacles: 4
  comm_radius: 0.5
  world_spawning_x: 1.5
  world_spawning_y: 1.5

guidance:
  mode: none

output:
  category: generalization
  results_dir: results

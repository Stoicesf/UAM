# Stage 2 / Exp3 — Sparse Attention Guide
experiment:
  id: exp2_sparse
  stage: 2
  name: "MAPPO + Sparse Guide"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo

guidance:
  mode: sparse
  guidance_dim: 4
  hidden_dim: 128
  num_heads: 4
  use_guidance_reward: true
  guidance_reward_coef: 0.1

output:
  results_dir: results
  figures_dir: figures

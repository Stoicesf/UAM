experiment:
  id: scalability_uav32
  stage: 5
  name: "DSGF v2 Scalability — 32 UAV"

train:
  seed: 42
  total_frames: 102_400
  algorithm: guided_mappo

env:
  num_agents: 32
  num_envs: 2
  comm_radius: 0.5
  scenario_kwargs:
    world_spawning_x: 3.0
    world_spawning_y: 3.0

guidance:
  mode: dsfg
  guidance_dim: 6
  hidden_dim: 128
  num_heads: 4
  num_spatial_layers: 2
  comm_radius: 0.5
  use_dynamic_quality: true
  use_temporal: true
  residual_policy: true
  use_guidance_reward: false
  beta_max: 1.0
  beta_min: 0.0
  beta_warmup_fraction: 0.2
  beta_decay_k: 3.0

output:
  category: scalability
  results_dir: results
